<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Telocan</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --user-bubble: #24304a;
    --assistant-bubble: #1c2028;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: row;
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
  }
  .new-chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .new-chat-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .conv-list-label {
    margin: 4px 2px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  #convList {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  .conv-item:hover {
    background: #1d222c;
    color: var(--text);
  }
  .conv-item.active {
    background: var(--user-bubble);
    color: var(--text);
  }
  .conv-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .conv-item:hover .conv-delete {
    opacity: 1;
  }
  .conv-delete:hover {
    color: var(--error);
    background: rgba(255, 107, 107, 0.1);
  }
  .conv-list-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 10px;
  }
  #main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .logout-link {
    flex-shrink: 0;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .logout-link:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 780px;
    width: 100%;
    align-self: center;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .msg.user {
    justify-content: flex-end;
  }
  .msg.assistant {
    justify-content: flex-start;
  }
  .msg.error {
    flex-direction: column;
    align-items: center;
  }
  .msg .role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
  .avatar.assistant {
    background: #f4c430;
    color: #2b2205;
  }
  .avatar.user {
    background: var(--accent);
    color: #fff;
  }
  .bubble {
    max-width: 78%;
    padding: 12px 14px;
    border-radius: 18px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.error .bubble {
    max-width: 100%;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  .msg.error .bubble {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .sql-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .sql-row details.sql-block {
    flex: 1;
    min-width: 0;
    margin-top: 0;
  }
  .report-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .report-btn:hover:not(:disabled) {
    color: var(--accent);
    background: rgba(79, 140, 255, 0.1);
  }
  .report-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  details.sql-block {
    margin-top: 10px;
    font-size: 12px;
  }
  details.sql-block summary {
    cursor: pointer;
    color: var(--muted);
    user-select: none;
  }
  details.sql-block summary:hover {
    color: var(--text);
  }
  details.sql-block pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: #0b0d12;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 12.5px;
    color: #c9d1e0;
  }
  .result-table-wrap {
    margin-top: 10px;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table.result-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  table.result-table th, table.result-table td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.result-table th {
    background: #1d222c;
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  table.result-table tr:last-child td {
    border-bottom: none;
  }
  .row-count {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  /* Shared pill-shaped input, reused in both the hero (empty) and bottom (chat) states */
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: #12141a;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .pill input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  .pill button {
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .pill button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .pill button:hover:not(:disabled) {
    background: #3f78e0;
  }

  /* Empty / hero state: centered greeting + pill input, no header or message log */
  #emptyState {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }
  #emptyState h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
  }
  #emptyState .pill {
    max-width: 640px;
    padding: 8px 8px 8px 22px;
  }
  #emptyState .pill input {
    font-size: 16px;
    padding: 10px 0;
  }
  #emptyState .pill button {
    width: 40px;
    height: 40px;
    font-size: 16px;
  }

  /* Chat state: bottom input bar, pill docked at the end of the message list */
  #bottomBar {
    display: none;
    justify-content: center;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #bottomBar .pill {
    max-width: 780px;
    padding: 6px 6px 6px 18px;
  }
  #bottomBar .pill input {
    font-size: 14px;
    padding: 8px 0;
  }
  #bottomBar .pill button {
    width: 36px;
    height: 36px;
    font-size: 14px;
  }

  .thinking {
    color: var(--muted);
    font-style: italic;
  }

  /* State toggles */
  body.state-empty #messages { display: none; }
  body.state-empty #bottomBar { display: none; }
  body.state-empty #emptyState { display: flex; }

  body.state-chat #emptyState { display: none; }
  body.state-chat #bottomBar { display: flex; }
</style>
</head>
<body class="state-empty" data-first-name="{{ first_name | e }}">
<div id="sidebar">
  <button class="new-chat-btn" id="newChatBtn">+ Yeni Sohbet</button>
  <div class="conv-list-label">Sohbetler</div>
  <div id="convList"></div>
</div>

<div id="main">
<header>
  <div>
    <h1>Telocan</h1>
    <p>Müşteriler, paketler, abonelikler, kullanım ve faturalar hakkında doğal dilde sorular sorun.</p>
  </div>
  {% if is_admin %}<a class="logout-link" href="/admin">Admin Paneli</a>{% endif %}
  <a class="logout-link" href="/logout">Çıkış Yap</a>
</header>

<div id="emptyState">
  <h2>Ne öğrenmek istersiniz?</h2>
  <div class="pill" id="pill">
    <input id="questionInput" type="text" placeholder="Müşteriler, paketler, kullanım veya faturalar hakkında sorun..." autofocus />
    <button id="sendBtn" aria-label="Gönder">&#10148;</button>
  </div>
</div>

<div id="messages"></div>

<div id="bottomBar"></div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const pillEl = document.getElementById('pill');
const bottomBarEl = document.getElementById('bottomBar');
const emptyStateEl = document.getElementById('emptyState');
const convListEl = document.getElementById('convList');
const newChatBtn = document.getElementById('newChatBtn');

let chatStarted = false;
let currentConversationId = null;

const TR_MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];

function formatConversationLabel(conv) {
  const d = new Date(conv.created_at);
  return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()} · #${conv.id}`;
}

function enterChatState() {
  if (chatStarted) return;
  chatStarted = true;
  bottomBarEl.appendChild(pillEl);
  document.body.classList.remove('state-empty');
  document.body.classList.add('state-chat');
}

function resetToEmptyState() {
  chatStarted = false;
  currentConversationId = null;
  messagesEl.innerHTML = '';
  emptyStateEl.appendChild(pillEl);
  document.body.classList.remove('state-chat');
  document.body.classList.add('state-empty');
  inputEl.value = '';
  setActiveConversation(null);
  inputEl.focus();
}

function setActiveConversation(id) {
  Array.from(convListEl.children).forEach(child => {
    child.classList.toggle('active', child.dataset.id === String(id));
  });
}

function buildConversationItem(conv) {
  const item = el('div', 'conv-item');
  item.dataset.id = String(conv.id);
  if (conv.id === currentConversationId) item.classList.add('active');

  const label = el('span', 'conv-label', formatConversationLabel(conv));
  const delBtn = el('button', 'conv-delete', '🗑');
  delBtn.type = 'button';
  delBtn.setAttribute('aria-label', 'Sohbeti sil');

  item.appendChild(label);
  item.appendChild(delBtn);

  item.addEventListener('click', () => loadConversation(conv.id));
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    deleteConversation(conv.id, item);
  });

  return item;
}

function renderConversationList(convs) {
  convListEl.innerHTML = '';
  if (!convs.length) {
    convListEl.appendChild(el('div', 'conv-list-empty', 'Henüz sohbet yok'));
    return;
  }
  convs.forEach(conv => convListEl.appendChild(buildConversationItem(conv)));
}

async function loadConversationList() {
  try {
    const resp = await fetch('/conversations');
    if (!resp.ok) throw new Error('failed');
    const convs = await resp.json();
    renderConversationList(convs);
  } catch (err) {
    convListEl.innerHTML = '';
    convListEl.appendChild(el('div', 'conv-list-empty', 'Sohbetler yüklenemedi'));
  }
}

async function loadConversation(id) {
  try {
    const resp = await fetch(`/conversations/${id}/messages`);
    if (!resp.ok) throw new Error('failed');
    const msgs = await resp.json();

    enterChatState();
    messagesEl.innerHTML = '';
    msgs.forEach(m => {
      addMessage('user', m.question);
      addAssistantResult({ question: m.question, sql: m.sql, rows: m.rows });
    });

    currentConversationId = id;
    setActiveConversation(id);
  } catch (err) {
    addMessage('error', 'Sohbet yüklenemedi: ' + err.message);
  }
}

async function deleteConversation(id, itemEl) {
  if (!confirm('Bu sohbeti silmek istediğinizden emin misiniz?')) return;
  try {
    const resp = await fetch(`/conversations/${id}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error('failed');
    itemEl.remove();
    if (!convListEl.children.length) {
      convListEl.appendChild(el('div', 'conv-list-empty', 'Henüz sohbet yok'));
    }
    if (currentConversationId === id) {
      resetToEmptyState();
    }
  } catch (err) {
    alert('Sohbet silinemedi.');
  }
}

newChatBtn.addEventListener('click', resetToEmptyState);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const userFirstName = document.body.dataset.firstName;
const userInitial = userFirstName ? userFirstName.charAt(0).toUpperCase() : '?';

function avatarEl(role) {
  const a = el('div', 'avatar ' + role);
  a.textContent = role === 'user' ? userInitial : 'T';
  return a;
}

function addMessage(role, text) {
  const wrap = el('div', 'msg ' + role);
  const bubble = el('div', 'bubble', text);

  if (role === 'error') {
    const roleLabel = el('div', 'role', 'Hata');
    wrap.appendChild(roleLabel);
    wrap.appendChild(bubble);
  } else if (role === 'user') {
    wrap.appendChild(bubble);
    wrap.appendChild(avatarEl('user'));
  } else {
    wrap.appendChild(avatarEl('assistant'));
    wrap.appendChild(bubble);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrap, bubble };
}

function buildResultTable(rows) {
  if (!rows || rows.length === 0) {
    return el('div', 'row-count', 'Sonuç bulunamadı.');
  }
  const cols = Object.keys(rows[0]);
  const wrap = el('div', 'result-table-wrap');
  const table = el('table', 'result-table');
  const thead = el('thead');
  const headRow = el('tr');
  cols.forEach(c => headRow.appendChild(el('th', null, c)));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  rows.forEach(row => {
    const tr = el('tr');
    cols.forEach(c => {
      let val = row[c];
      if (val === null || val === undefined) val = '';
      tr.appendChild(el('td', null, String(val)));
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  const countLine = el('div', 'row-count', `${rows.length} satır`);
  const container = document.createDocumentFragment();
  container.appendChild(wrap);
  container.appendChild(countLine);
  return container;
}

function showToast(message) {
  const toast = el('div', 'toast', message);
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

async function sendReport(result, btn) {
  btn.disabled = true;
  try {
    const resp = await fetch('/reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: result.question, sql: result.sql, rows: result.rows })
    });
    if (!resp.ok) throw new Error('failed');
    showToast('Rapor yollandı.');
  } catch (err) {
    showToast('Rapor gönderilemedi.');
  } finally {
    btn.disabled = false;
  }
}

function addAssistantResult(result) {
  const { bubble } = addMessage('assistant', '');
  bubble.appendChild(buildResultTable(result.rows));

  const details = el('details', 'sql-block');
  const summary = el('summary', null, "Oluşturulan SQL'i göster");
  const pre = el('pre', null, result.sql);
  details.appendChild(summary);
  details.appendChild(pre);

  const reportBtn = el('button', 'report-btn', '🚩');
  reportBtn.type = 'button';
  reportBtn.title = 'Bu yanıtı raporla';
  reportBtn.setAttribute('aria-label', 'Raporla');
  reportBtn.addEventListener('click', () => sendReport(result, reportBtn));

  const sqlRow = el('div', 'sql-row');
  sqlRow.appendChild(details);
  sqlRow.appendChild(reportBtn);
  bubble.appendChild(sqlRow);
}

async function sendQuestion() {
  const question = inputEl.value.trim();
  if (!question) return;

  enterChatState();
  addMessage('user', question);
  inputEl.value = '';
  sendBtn.disabled = true;

  const { wrap: thinkingWrap, bubble: thinkingBubble } = addMessage('assistant', '');
  thinkingBubble.innerHTML = '<span class="thinking">Düşünüyor…</span>';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversation_id: currentConversationId })
    });
    const data = await resp.json();
    thinkingWrap.remove();

    if (!resp.ok) {
      addMessage('error', data.error || 'Bir şeyler ters gitti.');
    } else {
      addAssistantResult(data);
      const isNewConversation = currentConversationId === null;
      currentConversationId = data.conversation_id;
      if (isNewConversation) {
        await loadConversationList();
      }
      setActiveConversation(currentConversationId);
    }
  } catch (err) {
    thinkingWrap.remove();
    addMessage('error', 'Ağ hatası: ' + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendQuestion);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuestion();
});

loadConversationList();
</script>
</body>
</html>
