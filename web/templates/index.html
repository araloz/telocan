<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Telocan</title>
<script>
  // Apply the stored theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      if (localStorage.getItem('telocan-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --user-bubble: #24304a;
    --assistant-bubble: #1c2028;
    --error: #ff6b6b;
    --hover-bg: #1d222c;
    --code-bg: #0b0d12;
    --code-text: #c9d1e0;
    --pill-bg: #12141a;
    --accent-hover: #3f78e0;
  }
  [data-theme="light"] {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2f6fed;
    --user-bubble: #d9e6ff;
    --assistant-bubble: #f0f2f5;
    --error: #d92d20;
    --hover-bg: #eef1f5;
    --code-bg: #f4f6f8;
    --code-text: #1f2937;
    --pill-bg: #f0f2f5;
    --accent-hover: #2559c9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: row;
  }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    height: 100vh;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 10px;
    overflow: hidden;
  }
  .new-chat-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .new-chat-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .conv-list-label {
    margin: 4px 2px 0;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  #convList {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
  }
  .conv-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 13px;
  }
  .conv-item:hover {
    background: var(--hover-bg);
    color: var(--text);
  }
  .conv-item.active {
    background: var(--user-bubble);
    color: var(--text);
  }
  .conv-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conv-delete {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .conv-item:hover .conv-delete {
    opacity: 1;
  }
  .conv-delete:hover {
    color: var(--error);
    background: rgba(255, 107, 107, 0.1);
  }
  .conv-list-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 10px;
  }
  #main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .logout-link {
    flex-shrink: 0;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .logout-link:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .account-menu {
    position: relative;
    flex-shrink: 0;
  }
  .account-menu-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .account-menu-trigger:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .account-menu-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 190px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 100;
  }
  .account-menu.open .account-menu-dropdown {
    display: flex;
  }
  .account-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .account-menu-item:hover {
    background: var(--hover-bg);
  }
  .account-menu-sep {
    height: 1px;
    background: var(--border);
    margin: 4px 2px;
  }
  #themeMenuItem .theme-icon-light { display: none; }
  [data-theme="light"] #themeMenuItem .theme-icon-dark { display: none; }
  [data-theme="light"] #themeMenuItem .theme-icon-light { display: inline; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 780px;
    width: 100%;
    align-self: center;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .msg.user {
    justify-content: flex-end;
  }
  .msg.assistant {
    justify-content: flex-start;
  }
  .msg.error {
    flex-direction: column;
    align-items: center;
  }
  .msg .role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }
  .avatar.assistant {
    background: #f4c430;
    color: #2b2205;
  }
  .avatar.user {
    background: var(--accent);
    color: #fff;
  }
  .bubble {
    max-width: 78%;
    padding: 12px 14px;
    border-radius: 18px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .msg.error .bubble {
    max-width: 100%;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
  }
  .msg.error .bubble {
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
  }
  .sql-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .sql-row details.sql-block {
    flex: 1;
    min-width: 0;
    margin-top: 0;
  }
  .report-btn, .retry-btn, .csv-btn, .explain-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .report-btn:hover:not(:disabled), .retry-btn:hover:not(:disabled), .csv-btn:hover:not(:disabled), .explain-btn:hover:not(:disabled) {
    color: var(--accent);
    background: rgba(79, 140, 255, 0.1);
  }
  .report-btn:disabled, .retry-btn:disabled, .csv-btn:disabled, .explain-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .sql-explanation {
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-wrap;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  details.sql-block {
    margin-top: 10px;
    font-size: 12px;
  }
  details.sql-block summary {
    cursor: pointer;
    color: var(--muted);
    user-select: none;
  }
  details.sql-block summary:hover {
    color: var(--text);
  }
  details.sql-block pre {
    margin: 8px 0 0;
    padding: 10px 12px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
    font-family: "SF Mono", Consolas, Menlo, monospace;
    font-size: 12.5px;
    color: var(--code-text);
  }
  .result-table-wrap {
    margin-top: 10px;
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  table.result-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  table.result-table th, table.result-table td {
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.result-table th {
    background: var(--hover-bg);
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  table.result-table tr:last-child td {
    border-bottom: none;
  }
  .row-count {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .timing-line {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: help;
  }
  /* Shared pill-shaped input, reused in both the hero (empty) and bottom (chat) states */
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .pill input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  .pill button {
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .pill button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .pill button:hover:not(:disabled) {
    background: var(--accent-hover);
  }

  /* Empty / hero state: centered greeting + pill input, no header or message log */
  #emptyState {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }
  #emptyState h2 {
    margin: 0;
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
  }
  #emptyState .pill {
    max-width: 640px;
    padding: 8px 8px 8px 22px;
  }
  #emptyState .pill input {
    font-size: 16px;
    padding: 10px 0;
  }
  #emptyState .pill button {
    width: 40px;
    height: 40px;
    font-size: 16px;
  }

  /* Chat state: bottom input bar, pill docked at the end of the message list */
  #bottomBar {
    display: none;
    justify-content: center;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #bottomBar .pill {
    max-width: 780px;
    padding: 6px 6px 6px 18px;
  }
  #bottomBar .pill input {
    font-size: 14px;
    padding: 8px 0;
  }
  #bottomBar .pill button {
    width: 36px;
    height: 36px;
    font-size: 14px;
  }

  .thinking {
    color: var(--muted);
    font-style: italic;
  }

  /* State toggles */
  body.state-empty #messages { display: none; }
  body.state-empty #bottomBar { display: none; }
  body.state-empty #emptyState { display: flex; }

  body.state-chat #emptyState { display: none; }
  body.state-chat #bottomBar { display: flex; }

  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .confirm-dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    max-width: 400px;
    width: calc(100% - 40px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .confirm-message {
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .confirm-actions button {
    padding: 7px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .confirm-cancel-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .confirm-ok-btn {
    border-color: var(--error);
    color: var(--error);
  }
  .confirm-ok-btn:hover {
    background: var(--error);
    color: #fff;
  }
</style>
</head>
<body class="state-empty" data-first-name="{{ first_name | e }}">
<div id="sidebar">
  <button class="new-chat-btn" id="newChatBtn">+ Yeni Sohbet</button>
  <div class="conv-list-label">Sohbetler</div>
  <div id="convList"></div>
</div>

<div id="main">
<header>
  <div>
    <h1>Telocan</h1>
    <p>Müşteriler, paketler, abonelikler, kullanım ve faturalar hakkında doğal dilde sorular sorun.</p>
  </div>
  <div class="account-menu" id="accountMenu">
    <button class="account-menu-trigger" id="accountMenuTrigger" type="button" aria-label="Menü" aria-haspopup="true" aria-expanded="false">&#9776;</button>
    <div class="account-menu-dropdown" role="menu">
      <button class="account-menu-item" id="themeMenuItem" type="button" role="menuitem"><span class="theme-icon-dark">🌙 Koyu Tema</span><span class="theme-icon-light">☀️ Açık Tema</span></button>
      <div class="account-menu-sep"></div>
      {% if is_admin %}<a class="account-menu-item" href="/admin" role="menuitem">Admin Paneli</a>{% endif %}
      <a class="account-menu-item" href="/settings" role="menuitem">Ayarlar</a>
      <a class="account-menu-item" href="/logout" role="menuitem">Çıkış Yap</a>
    </div>
  </div>
</header>

<div id="emptyState">
  <h2>Ne öğrenmek istersiniz?</h2>
  <div class="pill" id="pill">
    <input id="questionInput" type="text" placeholder="Müşteriler, paketler, kullanım veya faturalar hakkında sorun..." autofocus />
    <button id="sendBtn" aria-label="Gönder">&#10148;</button>
  </div>
</div>

<div id="messages"></div>

<div id="bottomBar"></div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('questionInput');
const sendBtn = document.getElementById('sendBtn');
const pillEl = document.getElementById('pill');
const bottomBarEl = document.getElementById('bottomBar');
const emptyStateEl = document.getElementById('emptyState');
const convListEl = document.getElementById('convList');
const newChatBtn = document.getElementById('newChatBtn');

let chatStarted = false;
let currentConversationId = null;

const TR_MONTHS = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];

function formatConversationLabel(conv) {
  const d = new Date(conv.created_at);
  return `${d.getDate()} ${TR_MONTHS[d.getMonth()]} ${d.getFullYear()} · #${conv.id}`;
}

function enterChatState() {
  if (chatStarted) return;
  chatStarted = true;
  bottomBarEl.appendChild(pillEl);
  document.body.classList.remove('state-empty');
  document.body.classList.add('state-chat');
}

function resetToEmptyState() {
  chatStarted = false;
  currentConversationId = null;
  messagesEl.innerHTML = '';
  emptyStateEl.appendChild(pillEl);
  document.body.classList.remove('state-chat');
  document.body.classList.add('state-empty');
  inputEl.value = '';
  setActiveConversation(null);
  inputEl.focus();
}

function setActiveConversation(id) {
  Array.from(convListEl.children).forEach(child => {
    child.classList.toggle('active', child.dataset.id === String(id));
  });
}

function buildConversationItem(conv) {
  const item = el('div', 'conv-item');
  item.dataset.id = String(conv.id);
  if (conv.id === currentConversationId) item.classList.add('active');

  const label = el('span', 'conv-label', formatConversationLabel(conv));
  const delBtn = el('button', 'conv-delete', '🗑');
  delBtn.type = 'button';
  delBtn.setAttribute('aria-label', 'Sohbeti sil');

  item.appendChild(label);
  item.appendChild(delBtn);

  item.addEventListener('click', () => loadConversation(conv.id));
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    deleteConversation(conv.id, item);
  });

  return item;
}

function renderConversationList(convs) {
  convListEl.innerHTML = '';
  if (!convs.length) {
    convListEl.appendChild(el('div', 'conv-list-empty', 'Henüz sohbet yok'));
    return;
  }
  convs.forEach(conv => convListEl.appendChild(buildConversationItem(conv)));
}

async function loadConversationList() {
  try {
    const resp = await fetch('/conversations');
    if (!resp.ok) throw new Error('failed');
    const convs = await resp.json();
    renderConversationList(convs);
  } catch (err) {
    convListEl.innerHTML = '';
    convListEl.appendChild(el('div', 'conv-list-empty', 'Sohbetler yüklenemedi'));
  }
}

async function loadConversation(id) {
  try {
    const resp = await fetch(`/conversations/${id}/messages`);
    if (!resp.ok) throw new Error('failed');
    const msgs = await resp.json();

    enterChatState();
    messagesEl.innerHTML = '';
    msgs.forEach(m => {
      addMessage('user', m.question);
      addAssistantResult({ question: m.question, sql: m.sql, rows: m.rows, timing: m.timing });
    });

    currentConversationId = id;
    setActiveConversation(id);
  } catch (err) {
    addMessage('error', 'Sohbet yüklenemedi: ' + err.message);
  }
}

function showConfirmModal(message, confirmButtonText) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';

    const dialog = document.createElement('div');
    dialog.className = 'confirm-dialog';

    const msg = document.createElement('div');
    msg.className = 'confirm-message';
    msg.textContent = message;

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'confirm-cancel-btn';
    cancelBtn.textContent = 'İptal';

    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'confirm-ok-btn';
    okBtn.textContent = confirmButtonText || 'Sil';

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    dialog.appendChild(msg);
    dialog.appendChild(actions);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    function cleanup(result) {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') cleanup(false);
    }
    overlay.addEventListener('click', e => {
      if (e.target === overlay) cleanup(false);
    });
    cancelBtn.addEventListener('click', () => cleanup(false));
    okBtn.addEventListener('click', () => cleanup(true));
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  });
}

async function deleteConversation(id, itemEl) {
  if (!await showConfirmModal('Bu sohbeti silmek istediğinizden emin misiniz?', 'Sil')) return;
  try {
    const resp = await fetch(`/conversations/${id}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error('failed');
    itemEl.remove();
    if (!convListEl.children.length) {
      convListEl.appendChild(el('div', 'conv-list-empty', 'Henüz sohbet yok'));
    }
    if (currentConversationId === id) {
      resetToEmptyState();
    }
  } catch (err) {
    alert('Sohbet silinemedi.');
  }
}

newChatBtn.addEventListener('click', resetToEmptyState);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const userFirstName = document.body.dataset.firstName;
const userInitial = userFirstName ? userFirstName.charAt(0).toUpperCase() : '?';

function avatarEl(role) {
  const a = el('div', 'avatar ' + role);
  a.textContent = role === 'user' ? userInitial : 'T';
  return a;
}

function addMessage(role, text) {
  const wrap = el('div', 'msg ' + role);
  const bubble = el('div', 'bubble', text);

  if (role === 'error') {
    const roleLabel = el('div', 'role', 'Hata');
    wrap.appendChild(roleLabel);
    wrap.appendChild(bubble);
  } else if (role === 'user') {
    wrap.appendChild(bubble);
    wrap.appendChild(avatarEl('user'));
  } else {
    wrap.appendChild(avatarEl('assistant'));
    wrap.appendChild(bubble);
  }

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { wrap, bubble };
}

function buildResultTable(rows) {
  if (!rows || rows.length === 0) {
    return el('div', 'row-count', 'Sonuç bulunamadı.');
  }
  const cols = Object.keys(rows[0]);
  const wrap = el('div', 'result-table-wrap');
  const table = el('table', 'result-table');
  const thead = el('thead');
  const headRow = el('tr');
  cols.forEach(c => headRow.appendChild(el('th', null, c)));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  rows.forEach(row => {
    const tr = el('tr');
    cols.forEach(c => {
      let val = row[c];
      if (val === null || val === undefined) val = '';
      tr.appendChild(el('td', null, String(val)));
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  const countLine = el('div', 'row-count', `${rows.length} satır`);
  const container = document.createDocumentFragment();
  container.appendChild(wrap);
  container.appendChild(countLine);
  return container;
}

function showToast(message) {
  const toast = el('div', 'toast', message);
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

async function explainSql(result, btn, sqlRow) {
  if (btn._explanationEl) {
    btn._explanationEl.hidden = !btn._explanationEl.hidden;
    return;
  }
  btn.disabled = true;
  try {
    const resp = await fetch('/explain-sql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql: result.sql })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error('failed');
    const box = el('div', 'sql-explanation', data.explanation);
    sqlRow.insertAdjacentElement('afterend', box);
    btn._explanationEl = box;
  } catch (err) {
    showToast('Açıklama alınamadı.');
  } finally {
    btn.disabled = false;
  }
}

async function sendReport(result, btn) {
  btn.disabled = true;
  try {
    const resp = await fetch('/reports', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: result.question, sql: result.sql, rows: result.rows })
    });
    if (!resp.ok) throw new Error('failed');
    showToast('Rapor yollandı.');
  } catch (err) {
    showToast('Rapor gönderilemedi.');
  } finally {
    btn.disabled = false;
  }
}

function csvField(val) {
  if (val === null || val === undefined) return '';
  const s = String(val);
  if (/[",\n\r]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function rowsToCsv(rows) {
  const cols = Object.keys(rows[0]);
  const lines = [cols.map(csvField).join(',')];
  rows.forEach(row => {
    lines.push(cols.map(c => csvField(row[c])).join(','));
  });
  return lines.join('\r\n');
}

function downloadCsv(rows) {
  const csv = rowsToCsv(rows);
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  const a = document.createElement('a');
  a.href = url;
  a.download = `telocan-sonuclar-${ts}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function addAssistantResult(result) {
  const { bubble } = addMessage('assistant', '');
  bubble.appendChild(buildResultTable(result.rows));

  if (result.timing) {
    const fmtMs = ms => ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
    const t = result.timing;
    const countLine = bubble.querySelector('.row-count');
    if (countLine) {
      const timingSpan = el('span', 'timing-line', ` · ⏱ ${fmtMs(t.total_ms)}`);
      timingSpan.title = `LLM: ${fmtMs(t.llm_ms)}, Veritabanı: ${fmtMs(t.db_ms)}`;
      countLine.appendChild(timingSpan);
    }
  }

  const details = el('details', 'sql-block');
  const summary = el('summary', null, "Oluşturulan SQL'i göster");
  const pre = el('pre', null, result.sql);
  details.appendChild(summary);
  details.appendChild(pre);

  const retryBtn = el('button', 'retry-btn', '🔄');
  retryBtn.type = 'button';
  retryBtn.title = 'Tekrar dene';
  retryBtn.setAttribute('aria-label', 'Tekrar dene');
  retryBtn.addEventListener('click', () => retryQuestion(result.question, retryBtn));

  const reportBtn = el('button', 'report-btn', '🚩');
  reportBtn.type = 'button';
  reportBtn.title = 'Bu yanıtı raporla';
  reportBtn.setAttribute('aria-label', 'Raporla');
  reportBtn.addEventListener('click', () => sendReport(result, reportBtn));

  const explainBtn = el('button', 'explain-btn', '💡');
  explainBtn.type = 'button';
  explainBtn.title = "Bu SQL'i açıkla";
  explainBtn.setAttribute('aria-label', 'Açıkla');

  const sqlRow = el('div', 'sql-row');
  sqlRow.appendChild(details);
  sqlRow.appendChild(retryBtn);
  sqlRow.appendChild(reportBtn);
  sqlRow.appendChild(explainBtn);
  explainBtn.addEventListener('click', () => explainSql(result, explainBtn, sqlRow));

  if (result.rows && result.rows.length > 0) {
    const csvBtn = el('button', 'csv-btn', '📥');
    csvBtn.type = 'button';
    csvBtn.title = 'CSV olarak indir';
    csvBtn.setAttribute('aria-label', 'CSV olarak indir');
    csvBtn.addEventListener('click', () => downloadCsv(result.rows));
    sqlRow.appendChild(csvBtn);
  }

  bubble.appendChild(sqlRow);
}

async function submitQuestion(question) {
  addMessage('user', question);

  const { wrap: thinkingWrap, bubble: thinkingBubble } = addMessage('assistant', '');
  thinkingBubble.innerHTML = '<span class="thinking">Düşünüyor…</span>';

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, conversation_id: currentConversationId })
    });
    const data = await resp.json();
    thinkingWrap.remove();

    if (!resp.ok) {
      addMessage('error', data.error || 'Bir şeyler ters gitti.');
    } else {
      addAssistantResult(data);
      const isNewConversation = currentConversationId === null;
      currentConversationId = data.conversation_id;
      if (isNewConversation) {
        await loadConversationList();
      }
      setActiveConversation(currentConversationId);
    }
  } catch (err) {
    thinkingWrap.remove();
    addMessage('error', 'Ağ hatası: ' + err.message);
  }
}

async function sendQuestion() {
  const question = inputEl.value.trim();
  if (!question) return;

  enterChatState();
  inputEl.value = '';
  sendBtn.disabled = true;

  await submitQuestion(question);

  sendBtn.disabled = false;
  inputEl.focus();
}

async function retryQuestion(question, btn) {
  btn.disabled = true;
  try {
    await submitQuestion(question);
  } finally {
    btn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendQuestion);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuestion();
});

const accountMenu = document.getElementById('accountMenu');
const accountMenuTrigger = document.getElementById('accountMenuTrigger');
const themeMenuItem = document.getElementById('themeMenuItem');

accountMenuTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = accountMenu.classList.toggle('open');
  accountMenuTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
});

document.addEventListener('click', (e) => {
  if (!accountMenu.contains(e.target)) {
    accountMenu.classList.remove('open');
    accountMenuTrigger.setAttribute('aria-expanded', 'false');
  }
});

themeMenuItem.addEventListener('click', () => {
  const goingLight = document.documentElement.getAttribute('data-theme') !== 'light';
  if (goingLight) {
    document.documentElement.setAttribute('data-theme', 'light');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  try {
    localStorage.setItem('telocan-theme', goingLight ? 'light' : 'dark');
  } catch (e) {}
});

loadConversationList();
</script>
