<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Telocan — Giriş</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .card h1 {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .error {
    color: var(--error);
    font-size: 13px;
    margin-bottom: 12px;
    text-align: center;
  }
  .link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .link a {
    color: var(--accent);
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Telocan'a Giriş Yap</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="email">E-posta</label>
      <input type="email" id="email" name="email" required>
      <label for="password">Şifre</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Giriş Yap</button>
    </form>
    <div class="link">Hesabın yok mu? <a href="/register">Kayıt Ol</a></div>
  </div>
</body>
</html>
