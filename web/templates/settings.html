<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>
  // Apply the stored theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      if (localStorage.getItem('telocan-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>
<title>Telocan — Ayarlar</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --error: #ff6b6b;
    --success: #3ddc84;
  }
  [data-theme="light"] {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2f6fed;
    --error: #d92d20;
    --success: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .card h1 {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .error {
    color: var(--error);
    font-size: 13px;
    margin-bottom: 12px;
    text-align: center;
  }
  .success {
    background: rgba(61, 220, 132, 0.12);
    border: 1px solid #2e5a41;
    color: var(--success);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
  }
  .tab-nav {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
  }
  .tab-link {
    flex: 1;
    padding: 8px 6px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    width: auto;
  }
  .tab-link:hover {
    color: var(--text);
  }
  .tab-link.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .panel {
    display: none;
  }
  .panel.active {
    display: block;
  }
  .section-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .helper {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .link a {
    color: var(--accent);
    text-decoration: none;
  }
  .danger-zone {
    padding: 16px;
    border: 1px solid var(--error);
    border-radius: 8px;
    background: rgba(255, 107, 107, 0.06);
  }
  .danger-zone .section-title {
    color: var(--error);
  }
  .danger-zone button {
    background: var(--error);
  }
  .danger-zone button:hover {
    background: #e04f4f;
  }
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  .confirm-dialog {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    max-width: 400px;
    width: calc(100% - 40px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .confirm-message {
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .confirm-actions button {
    padding: 7px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .confirm-cancel-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .confirm-ok-btn {
    border-color: var(--error);
    color: var(--error);
  }
  .confirm-ok-btn:hover {
    background: var(--error);
    color: #fff;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Ayarlar</h1>
    {% if success %}<div class="success">{{ success }}</div>{% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <div class="tab-nav">
      <button type="button" class="tab-link active" data-panel="profilePanel">Profil Bilgileri</button>
      <button type="button" class="tab-link" data-panel="passwordPanel">Şifre Değiştir</button>
      <button type="button" class="tab-link" data-panel="deletePanel">Hesabı Sil</button>
    </div>

    <div id="profilePanel" class="panel active">
      <form method="POST" action="/settings">
        <label for="first_name">Ad</label>
        <input type="text" id="first_name" name="first_name" value="{{ first_name or '' }}" required>
        <label for="last_name">Soyad</label>
        <input type="text" id="last_name" name="last_name" value="{{ last_name or '' }}" required>
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        <button type="submit">Kaydet</button>
      </form>
    </div>

    <div id="passwordPanel" class="panel">
      <form method="POST" action="/settings/password">
        <label for="current_password">Mevcut Şifre</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
        <label for="new_password">Yeni Şifre</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="6" required>
        <button type="submit">Şifreyi Güncelle</button>
      </form>
    </div>

    <div id="deletePanel" class="panel">
      <div class="danger-zone">
        <p class="section-title">Tehlikeli Bölge</p>
        <p class="helper">Hesabınızı sildiğinizde tüm sohbetleriniz, raporlarınız ve verileriniz kalıcı olarak silinir. Bu işlem geri alınamaz.</p>
        <form method="POST" action="/delete-account" id="deleteAccountForm">
          <label for="delete_current_password">Şifrenizi girerek onaylayın</label>
          <input type="password" id="delete_current_password" name="current_password" autocomplete="current-password" required>
          <button type="submit">Hesabımı Sil</button>
        </form>
      </div>
    </div>

    <div class="link"><a href="/forgot-password">Şifremi Unuttum</a></div>
    <div class="link"><a href="/">← Telocan'a dön</a></div>
  </div>

<script>
const tabLinks = document.querySelectorAll('.tab-link');
const panels = document.querySelectorAll('.panel');
tabLinks.forEach(link => {
  link.addEventListener('click', () => {
    const targetId = link.dataset.panel;
    tabLinks.forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    panels.forEach(p => p.classList.toggle('active', p.id === targetId));
  });
});

function showConfirmModal(message, confirmButtonText) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';

    const dialog = document.createElement('div');
    dialog.className = 'confirm-dialog';

    const msg = document.createElement('div');
    msg.className = 'confirm-message';
    msg.textContent = message;

    const actions = document.createElement('div');
    actions.className = 'confirm-actions';

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'confirm-cancel-btn';
    cancelBtn.textContent = 'İptal';

    const okBtn = document.createElement('button');
    okBtn.type = 'button';
    okBtn.className = 'confirm-ok-btn';
    okBtn.textContent = confirmButtonText || 'Sil';

    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    dialog.appendChild(msg);
    dialog.appendChild(actions);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    function cleanup(result) {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
      resolve(result);
    }
    function onKey(e) {
      if (e.key === 'Escape') cleanup(false);
    }
    overlay.addEventListener('click', e => {
      if (e.target === overlay) cleanup(false);
    });
    cancelBtn.addEventListener('click', () => cleanup(false));
    okBtn.addEventListener('click', () => cleanup(true));
    document.addEventListener('keydown', onKey);
    okBtn.focus();
  });
}

const deleteAccountForm = document.getElementById('deleteAccountForm');
let deleteAccountConfirmed = false;
deleteAccountForm.addEventListener('submit', async event => {
  if (deleteAccountConfirmed) return;
  event.preventDefault();
  const ok = await showConfirmModal('Hesabınızı kalıcı olarak silmek istediğinizden emin misiniz? Bu işlem geri alınamaz.', 'Sil');
  if (ok) {
    deleteAccountConfirmed = true;
    deleteAccountForm.submit();
  }
});
</script>
</body>
</html>
