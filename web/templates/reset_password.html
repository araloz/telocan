<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<script>
  // Apply the stored theme before first paint to avoid a flash of the wrong theme.
  (function () {
    try {
      if (localStorage.getItem('telocan-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) {}
  })();
</script>
<title>Telocan — Şifre Sıfırla</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ee;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --error: #ff6b6b;
    --success: #3ddc84;
  }
  [data-theme="light"] {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #d8dce3;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2f6fed;
    --error: #d92d20;
    --success: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .card h1 {
    margin: 0 0 20px;
    font-size: 18px;
    text-align: center;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  .error {
    color: var(--error);
    font-size: 13px;
    margin-bottom: 12px;
    text-align: center;
  }
  .success {
    color: var(--success);
    font-size: 13px;
    margin-bottom: 12px;
    text-align: center;
  }
  .link {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .link a {
    color: var(--accent);
    text-decoration: none;
  }
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .theme-toggle:hover {
    border-color: var(--accent);
  }
  .theme-toggle .theme-icon-light { display: none; }
  [data-theme="light"] .theme-toggle .theme-icon-dark { display: none; }
  [data-theme="light"] .theme-toggle .theme-icon-light { display: inline; }
</style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Temayı değiştir" title="Temayı değiştir"><span class="theme-icon-dark">🌙</span><span class="theme-icon-light">☀️</span></button>
  <div class="card">
    <h1>Şifre Sıfırla</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}

    {% if token_valid %}
    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="new_password">Yeni Şifre</label>
      <input type="password" id="new_password" name="new_password" required minlength="6">
      <button type="submit">Şifreyi Güncelle</button>
    </form>
    {% endif %}

    <div class="link"><a href="/login">Giriş sayfasına dön</a></div>
  </div>
<script>
  document.getElementById('themeToggle').addEventListener('click', function () {
    var goingLight = document.documentElement.getAttribute('data-theme') !== 'light';
    if (goingLight) {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try {
      localStorage.setItem('telocan-theme', goingLight ? 'light' : 'dark');
    } catch (e) {}
  });
</script>
</body>
</html>
